name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          # Pinned runtime surface (pre-Linux remediation): the three
          # runtime-selected drivers composer now requires explicitly,
          # plus the transitive hard deps, so CI proves a minimal box.
          extensions: ctype, curl, dom, fileinfo, filter, gd, hash, intl, json, mbstring, openssl, pdo_pgsql, pdo_sqlite, redis, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Dependency audit (P7-006)
        run: composer audit --format=plain && npm audit --omit=dev

      - name: Run CI Checks
        run: composer ci:check
